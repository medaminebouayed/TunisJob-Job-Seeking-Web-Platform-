<div class="h-screen flex items-center justify-center bg-gray-50">
  <div class="max-w-md w-full p-8 bg-white rounded-xl shadow-lg">
    <div class="text-center mb-8">
      <img src="assets/images/jobgate.png" alt="JobGate Logo" class="h-16 w-auto mx-auto mb-4 object-contain">
      <h2 class="text-3xl font-bold text-gray-800">Admin Login</h2>
      <p class="text-gray-500 mt-2">Sign in to manage the platform</p>
    </div>
    
    <div *ngIf="error" class="mb-4 p-3 bg-red-100 text-red-700 rounded text-sm text-center">
      {{ error }}
    </div>

    <form (ngSubmit)="login()">
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
        <input type="email" [(ngModel)]="credentials.email" name="email" required class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-200">
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
        <input type="password" [(ngModel)]="credentials.password" name="password" required class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-200">
      </div>
      <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition">Login</button>
    </form>
  </div>
</div>
