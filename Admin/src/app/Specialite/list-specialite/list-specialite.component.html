<div class="space-y-6">
  <!-- Page Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Spécialités</h1>
      <p class="text-sm text-slate-500 mt-1">Gérez les spécialités liées à chaque catégorie.</p>
    </div>
    <div class="mt-4 sm:mt-0">
      <button routerLink="/SpecialiteAjouter" class="inline-flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors shadow-sm shadow-indigo-200">
        <svg class="w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Nouvelle Spécialité
      </button>
    </div>
  </div>

  <!-- Filters & Search -->
  <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-center justify-between space-y-3 sm:space-y-0">
    <div class="relative w-full sm:w-72">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3">
        <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </span>
      <input type="text" [(ngModel)]="searchTerm" class="w-full py-2 pl-10 pr-4 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all" placeholder="Rechercher une spécialité...">
    </div>
  </div>

  <!-- Data Table -->
  <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse whitespace-nowrap">
        <thead>
          <tr class="bg-slate-50 border-b border-slate-200">
            <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider w-32">ID</th>
            <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Nom de la Spécialité</th>
            <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider text-right w-32">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          
          <tr *ngFor="let spec of filteredSpecialties" class="hover:bg-slate-50/80 transition-colors">
            <td class="px-6 py-4 text-sm text-slate-500 font-mono">{{ spec.id }}</td>
            <td class="px-6 py-4">
              <div class="text-sm font-semibold text-slate-900 flex items-center">
                <div class="w-2 h-2 rounded-full bg-indigo-500 mr-3"></div>
                {{ spec.name }}
              </div>
            </td>
            <td class="px-6 py-4 text-right">
              <div class="flex justify-end space-x-2">
                <button [routerLink]="['/SpecialiteUpdate', spec.id]" class="p-1.5 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-md transition-colors" title="Modifier">
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                </button>
                <button (click)="deleteSpecialty(spec.id)" class="p-1.5 text-red-600 bg-red-50 hover:bg-red-100 rounded-md transition-colors" title="Supprimer">
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
              </div>
            </td>
          </tr>
          <tr *ngIf="filteredSpecialties.length === 0">
            <td colspan="3" class="px-6 py-4 text-center text-sm text-slate-500">Aucune spécialité trouvée.</td>
          </tr>

        </tbody>
      </table>
    </div>
  </div>
</div>
