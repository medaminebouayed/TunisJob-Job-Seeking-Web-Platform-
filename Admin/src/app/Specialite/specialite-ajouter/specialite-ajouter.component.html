<div class="space-y-6 max-w-2xl mx-auto">
  <!-- Page Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Ajouter une Spécialité</h1>
      <p class="text-sm text-slate-500 mt-1">Créez une nouvelle spécialité et associez-la à une catégorie.</p>
    </div>
    <button routerLink="/ListSpecialite" class="px-4 py-2 bg-white border border-slate-200 text-sm font-medium text-slate-600 rounded-lg hover:bg-slate-50 transition-colors flex items-center shadow-sm">
      <svg class="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      Retour à la liste
    </button>
  </div>

  <!-- Form Card -->
  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="p-6 sm:p-8">
      <form (ngSubmit)="onSubmit()">
        <div class="space-y-6">
          
          <!-- Nom de la spécialité -->
          <div>
            <label for="nom_spec" class="block text-sm font-semibold text-slate-700 mb-2">Nom de la Spécialité <span class="text-red-500">*</span></label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
              </div>
              <input type="text" id="nom_spec" name="nom_spec" [(ngModel)]="specialty.name" class="block w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-colors sm:text-sm" placeholder="Ex: Développeur Backend, Design Graphique..." required>
            </div>
          </div>

          <!-- Catégorie Associée -->
          <div>
            <label for="categorie_id" class="block text-sm font-semibold text-slate-700 mb-2">Catégorie Associée <span class="text-red-500">*</span></label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
              </div>
              <select id="categorie_id" name="categorie_id" [(ngModel)]="specialty.category_id" class="block w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-colors sm:text-sm appearance-none cursor-pointer" required>
                <option value="" disabled selected>Sélectionnez une catégorie...</option>
                <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
              </select>
              <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
                <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
              </div>
            </div>
            <p class="mt-2 text-xs text-slate-500">Associez cette spécialité à une catégorie mère existante.</p>
          </div>

        </div>

        <div class="mt-8 pt-6 border-t border-slate-100 flex items-center justify-end space-x-3">
          <button type="button" routerLink="/ListSpecialite" class="px-5 py-2.5 text-sm font-medium text-slate-600 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 hover:text-slate-900 transition-colors">
            Annuler
          </button>
          <button type="submit" [disabled]="isSubmitting" class="inline-flex items-center px-5 py-2.5 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 shadow-sm shadow-indigo-200 transition-colors disabled:opacity-50">
            <svg class="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            {{ isSubmitting ? 'Enregistrement...' : 'Enregistrer la spécialité' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
