<div class="space-y-6 max-w-2xl mx-auto">
  <!-- Page Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Ajouter une Catégorie</h1>
      <p class="text-sm text-slate-500 mt-1">Créez une nouvelle catégorie pour organiser les spécialités.</p>
    </div>
    <button routerLink="/ListCategorie" class="px-4 py-2 bg-white border border-slate-200 text-sm font-medium text-slate-600 rounded-lg hover:bg-slate-50 transition-colors flex items-center shadow-sm">
      <svg class="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      Retour à la liste
    </button>
  </div>

  <!-- Form Card -->
  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="p-6 sm:p-8">
      <form (ngSubmit)="onSubmit()">
        <div class="space-y-6">
          
          <!-- Nom de la catégorie -->
          <div>
            <label for="nom_categ" class="block text-sm font-semibold text-slate-700 mb-2">Nom de la Catégorie <span class="text-red-500">*</span></label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
              </div>
              <input type="text" id="nom_categ" name="nom_categ" [(ngModel)]="category.name" class="block w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-colors sm:text-sm" placeholder="Ex: IT & Logiciels, Marketing, Finance..." required>
            </div>
            <p class="mt-2 text-xs text-slate-500">Ce nom apparaîtra dans les filtres et lors de la création d'une spécialité.</p>
          </div>

        </div>

        <div class="mt-8 pt-6 border-t border-slate-100 flex items-center justify-end space-x-3">
          <button type="button" routerLink="/ListCategorie" class="px-5 py-2.5 text-sm font-medium text-slate-600 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 hover:text-slate-900 transition-colors">
            Annuler
          </button>
          <button type="submit" [disabled]="isSubmitting" class="inline-flex items-center px-5 py-2.5 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 shadow-sm shadow-indigo-200 transition-colors disabled:opacity-50">
            <svg class="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            {{ isSubmitting ? 'Enregistrement...' : 'Enregistrer la catégorie' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
