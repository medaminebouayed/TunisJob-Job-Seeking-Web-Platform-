<header class="flex items-center justify-between px-6 py-4 bg-white border-b border-slate-200">
  <div class="flex items-center">
    <h2 class="text-xl font-bold text-slate-800">
      Bonjour, {{ adminName }} !
    </h2>
  </div>

  <div class="flex items-center space-x-4">


    <!-- Notification -->
    <button class="relative p-2 text-slate-400 hover:text-slate-600 transition-colors rounded-full hover:bg-slate-50">
      <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
    </button>

    <div class="h-6 w-px bg-slate-200 mx-2"></div>

    <!-- Profile -->
    <div class="flex items-center cursor-pointer">
      <div class="w-9 h-9 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center font-bold text-sm shadow-sm ring-2 ring-white">
        AD
      </div>
      <div class="hidden md:block ml-3">
        <p class="text-sm font-semibold text-slate-700">{{ adminName }}</p>
        
      </div>
    </div>

    <!-- Separator -->
    <div class="h-6 w-px bg-slate-200 mx-4"></div>

    <!-- Logout -->
    <button (click)="logout()" class="relative p-2 text-slate-400 hover:text-red-500 transition-colors rounded-full hover:bg-red-50" title="Déconnexion">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
    </button>
  </div>
</header>
