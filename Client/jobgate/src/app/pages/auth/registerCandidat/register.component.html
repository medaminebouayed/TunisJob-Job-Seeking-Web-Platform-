<app-header-vistor></app-header-vistor>

<div class="bg-gray-50 min-h-[80vh] flex items-center justify-center p-4 py-12">
  <div
    class="max-w-xl w-full bg-white rounded-3xl p-8 sm:p-10 shadow-xl border border-gray-100 relative overflow-hidden">

    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-600"></div>

    <div class="text-center mb-6 relative z-10">
      <div class="cursor-pointer mb-4 inline-block transform hover:scale-105 transition-transform duration-300"
        routerLink="/">
        <img src="assets/images/jobgate.png" alt="JobGate" class="h-20 w-auto mx-auto">
      </div>
      <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight mb-2">Créer un Compte Candidat</h2>
      <p class="text-sm text-gray-500 font-medium">Rejoignez TunisJob et boostez votre carrière.</p>
    </div>

    <form class="space-y-6 relative z-10" (ngSubmit)="register()">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label for="first-name" class="block text-sm font-semibold text-gray-700 mb-2">Prénom</label>
          <input id="first-name" name="firstName" [(ngModel)]="registration.firstName" type="text" required
            class="block w-full border-gray-200 rounded-xl shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm py-3 transition hover:border-gray-300">
        </div>
        <div>
          <label for="last-name" class="block text-sm font-semibold text-gray-700 mb-2">Nom</label>
          <input id="last-name" name="lastName" [(ngModel)]="registration.lastName" type="text" required
            class="block w-full border-gray-200 rounded-xl shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm py-3 transition hover:border-gray-300">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Civilité</label>
          <select name="gender" [(ngModel)]="registration.gender"
            class="block w-full border-gray-200 rounded-xl shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm py-3 transition hover:border-gray-300">
            <option>Mr.</option>
            <option>Mme.</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Date de naissance</label>
          <input type="date" name="birthDate" [(ngModel)]="registration.birthDate"
            class="block w-full border-gray-200 rounded-xl shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm py-3 transition hover:border-gray-300">
        </div>
      </div>

      <div>
        <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Adresse Email</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
              <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path>
              <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path>
            </svg>
          </div>
          <input id="email" name="email" [(ngModel)]="registration.email" type="email" required
            class="pl-10 block w-full border-gray-200 rounded-xl shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm py-3 transition hover:border-gray-300"
            placeholder="vous@exemple.com">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Mot de passe</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                  d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                  clip-rule="evenodd"></path>
              </svg>
            </div>
            <input id="password" name="password" [(ngModel)]="registration.password"
              [type]="showPassword ? 'text' : 'password'" required autocomplete="new-password"
              class="pl-10 pr-12 block w-full border border-gray-300 rounded-xl shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm py-3 transition hover:border-gray-400"
              placeholder="Mot de passe">
            <button type="button" (click)="showPassword = !showPassword" [attr.aria-pressed]="showPassword"
              [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 rounded-lg">
              <svg *ngIf="!showPassword" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                </path>
              </svg>
              <svg *ngIf="showPassword" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21">
                </path>
              </svg>
            </button>
          </div>
        </div>
        <div>
          <label for="password_confirmation" class="block text-sm font-semibold text-gray-700 mb-2">Confirmer le mot de
            passe</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                  d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                  clip-rule="evenodd"></path>
              </svg>
            </div>
            <input id="password_confirmation" name="password_confirmation"
              [(ngModel)]="registration.password_confirmation" [type]="showPasswordConfirm ? 'text' : 'password'"
              required autocomplete="new-password"
              class="pl-10 pr-12 block w-full border border-gray-300 rounded-xl shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm py-3 transition hover:border-gray-400"
              placeholder="Confirmer le mot de passe">
            <button type="button" (click)="showPasswordConfirm = !showPasswordConfirm"
              [attr.aria-pressed]="showPasswordConfirm"
              [attr.aria-label]="showPasswordConfirm ? 'Masquer la confirmation' : 'Afficher la confirmation'"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 rounded-lg">
              <svg *ngIf="!showPasswordConfirm" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                </path>
              </svg>
              <svg *ngIf="showPasswordConfirm" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21">
                </path>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <button type="submit" [disabled]="isLoading"
        class="w-full flex justify-center items-center gap-2 py-4 px-4 border border-transparent rounded-xl shadow-md shadow-indigo-600/20 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 transition-all transform hover:-translate-y-0.5 mt-4">
        <svg *ngIf="isLoading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>
        {{ isLoading ? "Inscription en cours..." : "S'inscrire (Candidat)" }}
      </button>

    </form>

    <div class="mt-8 pt-6 border-t border-gray-100 text-center relative z-10">
      <p class="text-sm font-medium text-gray-500">
        Vous avez déjà un compte ?
        <a routerLink="/login/candidat"
          class="font-bold text-indigo-600 hover:text-indigo-500 hover:underline transition">Se connecter</a>
      </p>
      <div class="mt-4">
        <a routerLink="/register/recruteur" class="text-xs font-bold text-gray-400 hover:text-gray-600 hover:underline transition-colors">Espace Recruteur ?
          S'inscrire ici</a>
      </div>
    </div>
  </div>
</div>

<app-footer-vistor></app-footer-vistor>
