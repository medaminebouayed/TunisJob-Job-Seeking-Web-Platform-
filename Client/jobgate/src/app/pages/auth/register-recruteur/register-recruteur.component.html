<app-header-vistor></app-header-vistor>

<div class="bg-slate-50">
  <div class="min-h-[80vh] flex items-center justify-center p-4 py-12 font-sans">
    <div
      class="max-w-2xl w-full bg-white rounded-3xl p-8 sm:p-10 shadow-2xl border border-slate-100 relative overflow-hidden">

      <!-- Professional Recruiter Decor -->
      <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-600"></div>

      <div class="text-center mb-6 relative z-10">
        <div class="cursor-pointer mb-4 inline-block transform hover:scale-105 transition-transform duration-300"
          routerLink="/">
          <img src="assets/images/jobgate.png" alt="JobGate" class="h-20 w-auto mx-auto">
        </div>
        <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Inscription Recruteur</h2>
        <p class="text-sm text-slate-500 mt-2 font-medium">Créez votre compte entreprise et commencez à recruter sur
          TunisJob.</p>
      </div>

      <form class="space-y-6 relative z-10" (ngSubmit)="register()">

        <!-- Personal Info -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">Prénom</label>
            <input name="firstName" [(ngModel)]="registration.firstName" type="text" required
              class="block w-full border-slate-200 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 sm:text-sm py-3 px-4 transition bg-slate-50/50"
              placeholder="Ex: Ahmed">
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">Nom</label>
            <input name="lastName" [(ngModel)]="registration.lastName" type="text" required
              class="block w-full border-slate-200 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 sm:text-sm py-3 px-4 transition bg-slate-50/50"
              placeholder="Ex: Ben Ali">
          </div>
        </div>

        <!-- Professional Info -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 p-6 bg-indigo-50/30 rounded-2xl border border-indigo-100/50">
          <div class="sm:col-span-2">
            <h3 class="text-xs font-black text-indigo-600 uppercase tracking-widest mb-4">Informations Entreprise</h3>
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">Nom de
              l'Entreprise</label>
            <input name="enterpriseName" [(ngModel)]="registration.enterpriseName" type="text" required
              class="block w-full border-slate-200 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 sm:text-sm py-3 px-4 transition bg-white"
              placeholder="Ex: Tech Solutions">
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">Secteur
              d'Activité</label>
            <input name="enterpriseSector" [(ngModel)]="registration.enterpriseSector" type="text" required
              class="block w-full border-slate-200 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 sm:text-sm py-3 px-4 transition bg-white"
              placeholder="Ex: Informatique">
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">Votre Fonction</label>
            <input name="jobTitle" [(ngModel)]="registration.jobTitle" type="text" required
              class="block w-full border-slate-200 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 sm:text-sm py-3 px-4 transition bg-white"
              placeholder="Ex: Responsable RH">
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">Téléphone Pro</label>
            <input name="phone" [(ngModel)]="registration.phone" type="text" required
              class="block w-full border-slate-200 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 sm:text-sm py-3 px-4 transition bg-white"
              placeholder="+216 ...">
          </div>
        </div>

        <!-- Auth Info -->
        <div class="space-y-6">
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">Email
              Professionnel</label>
            <input name="email" [(ngModel)]="registration.email" type="email" required
              class="block w-full border border-slate-300 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 sm:text-sm py-3 px-4 transition bg-slate-50/50"
              placeholder="rh@entreprise.tn">
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">Mot de passe</label>
              <div class="relative">
                <input name="password" [(ngModel)]="registration.password" [type]="showPassword ? 'text' : 'password'"
                  required autocomplete="new-password"
                  class="block w-full border border-slate-300 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 sm:text-sm py-3 pl-4 pr-12 transition bg-slate-50/50"
                  placeholder="Au moins 8 caractères">
                <button type="button" (click)="showPassword = !showPassword" [attr.aria-pressed]="showPassword"
                  [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
                  class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 rounded-lg">
                  <svg *ngIf="!showPassword" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                    </path>
                  </svg>
                  <svg *ngIf="showPassword" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21">
                    </path>
                  </svg>
                </button>
              </div>
            </div>
            <div>
              <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">Confirmer le mot de
                passe</label>
              <div class="relative">
                <input name="password_confirmation" [(ngModel)]="registration.password_confirmation"
                  [type]="showPasswordConfirm ? 'text' : 'password'" required autocomplete="new-password"
                  class="block w-full border border-slate-300 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 sm:text-sm py-3 pl-4 pr-12 transition bg-slate-50/50"
                  placeholder="Répétez le mot de passe">
                <button type="button" (click)="showPasswordConfirm = !showPasswordConfirm"
                  [attr.aria-pressed]="showPasswordConfirm"
                  [attr.aria-label]="showPasswordConfirm ? 'Masquer la confirmation' : 'Afficher la confirmation'"
                  class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 rounded-lg">
                  <svg *ngIf="!showPasswordConfirm" class="h-5 w-5" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                    </path>
                  </svg>
                  <svg *ngIf="showPasswordConfirm" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21">
                    </path>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <button type="submit" [disabled]="isLoading"
          class="w-full flex justify-center items-center gap-2 py-4 px-4 border border-transparent rounded-xl shadow-xl shadow-indigo-600/20 text-sm font-bold text-white bg-slate-900 hover:bg-slate-800 disabled:opacity-50 transition-all transform hover:-translate-y-0.5 mt-8">
          <svg *ngIf="isLoading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          {{ isLoading ? "Création du compte..." : "Créer mon compte Recruteur" }}
        </button>

      </form>

      <div class="mt-8 pt-6 border-t border-slate-100 text-center relative z-10">
        <p class="text-sm font-medium text-slate-500">
          Vous avez déjà un compte entreprise ?
          <a routerLink="/login/recruteur" class="font-bold text-indigo-600 hover:text-indigo-500 transition">Se
            connecter</a>
        </p>
        <div class="mt-4">
          <a routerLink="/register/candidat"
            class="text-xs font-bold text-slate-400 hover:text-slate-600 underline">Espace Candidat ? S'inscrire ici</a>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer-vistor></app-footer-vistor>
