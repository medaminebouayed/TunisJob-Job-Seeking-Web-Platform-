<app-header-vistor></app-header-vistor>

<div class="bg-slate-50 min-h-[80vh] flex items-center justify-center p-4 py-12 font-sans bg-slate-50">
  <div
    class="max-w-md w-full bg-white rounded-3xl p-8 sm:p-10 shadow-2xl border border-slate-100 relative overflow-hidden">

    <!-- Professional Recruiter Decor -->
    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-600"></div>

    <div class="text-center mb-6 relative z-10">
      <div class="cursor-pointer mb-4 inline-block transform hover:scale-105 transition-transform duration-300"
        routerLink="/">
        <img src="assets/images/jobgate.png" alt="JobGate" class="h-20 w-auto mx-auto ">
      </div>
      <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Espace Recruteur</h2>
      <p class="text-sm text-slate-500 mt-2 font-medium">Gérez vos talents et vos offres d'emploi.</p>
    </div>

    <form class="space-y-6 relative z-10" (ngSubmit)="login()">

      <div>
        <label for="email" class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">Email
          Professionnel</label>
        <div class="relative group">
          <div
            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-indigo-600 transition-colors">
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
              <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path>
              <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path>
            </svg>
          </div>
          <input id="email" name="email" [(ngModel)]="credentials.email" type="email" required
            class="pl-12 block w-full border-slate-200 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 sm:text-sm py-4 transition bg-slate-50/50"
            placeholder="nom@entreprise.tn">
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-2">
          <label for="password" class="block text-sm font-bold text-slate-700 uppercase tracking-wide">Mot de
            passe</label>
        </div>
        <div class="relative group">
          <div
            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-indigo-600 transition-colors">
            <svg class="h-5 w-5" fill-rule="evenodd"
              d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
              clip-rule="evenodd" fill="currentColor"></svg>
          </div>
          <input id="password" name="password" [(ngModel)]="credentials.password"
            [type]="showPassword ? 'text' : 'password'" required autocomplete="current-password"
            class="pl-12 pr-12 block w-full border border-slate-300 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 sm:text-sm py-4 transition bg-slate-50/50"
            placeholder="••••••••">
          <button type="button" (click)="showPassword = !showPassword" [attr.aria-pressed]="showPassword"
            [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 rounded-lg">
            <svg *ngIf="!showPassword" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
              aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
              </path>
            </svg>
            <svg *ngIf="showPassword" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
              aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21">
              </path>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="isLoading"
        class="w-full flex justify-center items-center gap-2 py-4 px-4 border border-transparent rounded-xl shadow-xl shadow-indigo-600/20 text-sm font-bold text-white bg-slate-900 hover:bg-slate-800 disabled:opacity-50 transition-all transform hover:-translate-y-0.5 mt-8">
        <svg *ngIf="isLoading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>
        {{ isLoading ? 'Connexion au Dashboard...' : 'Se connecter au Dashboard' }}
      </button>

    </form>

    <div class="mt-10 pt-6 border-t border-slate-100 text-center relative z-10">
      <p class="text-sm font-medium text-slate-500">
        Pas encore membre ?
        <a routerLink="/register/recruteur" class="font-bold text-indigo-600 hover:text-indigo-500 transition">Créer un
          compte entreprise</a>
      </p>
      <div class="mt-4">
        <a routerLink="/login/candidat" class="text-xs font-bold text-slate-400 hover:text-slate-600 underline">Espace
          Candidat ? C'est par ici</a>
      </div>
    </div>
  </div>
</div>

<app-footer-vistor></app-footer-vistor>
