<nav class="flex items-center space-x-2" aria-label="Breadcrumb">
  <ol class="flex items-center space-x-2">
    <li *ngFor="let item of items; let last = last" class="flex items-center">
      <ng-container *ngIf="!last; else activeItem">
        <button (click)="navigate(item.path)"
          class="text-xs font-bold text-indigo-400 hover:text-indigo-600 transition-colors uppercase tracking-widest">
          {{ item.label }}
        </button>
        <svg class="w-3 h-3 mx-2 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
      </ng-container>

      <ng-template #activeItem>
        <span class="text-sm text-gray-600 font-medium">{{ item.label }}</span>
      </ng-template>
    </li>
  </ol>
</nav>
